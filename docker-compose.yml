version: '3.8'

services:
  web:
    build: .
    container_name: cnpmhdt_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./CNPMHDT:/var/www/html
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=bandoan
      - DB_PORT=3306
    depends_on:
      - db

  db:
    image: mariadb:10.4
    container_name: cnpmhdt_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=bandoan
    ports:
      - "3306:3306"
    volumes:
      - ./CNPMHDT/bandoan.sql:/docker-entrypoint-initdb.d/01_bandoan.sql
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: cnpmhdt_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=rootpassword
      - MYSQL_ROOT_PASSWORD=rootpassword
    depends_on:
      - db

volumes:
  db_data:
